<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E.T. Escape - 3D Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        #gameContainer {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: linear-gradient(180deg, #001a4d 0%, #0d0d1a 100%);
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #startScreen, #gameOverScreen, #winScreen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            pointer-events: auto;
            z-index: 100;
        }
        #startScreen.hidden, #gameOverScreen.hidden, #winScreen.hidden {
            display: none !important;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 30px;
            color: #00ff00;
            text-shadow: 0 0 20px #00ff00;
        }
        p {
            font-size: 1.2em;
            margin: 15px 0;
            color: #00ff00;
        }
        button {
            padding: 15px 40px;
            font-size: 1.2em;
            background: #00ff00;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover {
            background: #00cc00;
            transform: scale(1.1);
        }
        button:active {
            transform: scale(0.95);
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.3em;
            color: #00ff00;
            background: rgba(0, 30, 0, 0.8);
            padding: 20px;
            border: 2px solid #00ff00;
            border-radius: 8px;
            pointer-events: auto;
            display: none;
        }
        .hud-line {
            margin: 8px 0;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 30, 0, 0.8);
            padding: 15px;
            border: 2px solid #00ff00;
            color: #00ff00;
            font-size: 1em;
            border-radius: 8px;
            pointer-events: auto;
            display: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div id="startScreen">
                <h1>E.T. ESCAPE</h1>
                <p>Help E.T. reach the spaceship!</p>
                <p>Avoid FBI agents and collect power-ups</p>
                <button id="startBtn">START GAME</button>
            </div>
            <div id="gameOverScreen" class="hidden">
                <h1>GAME OVER</h1>
                <p>Final Score: <span id="finalScore">0</span></p>
                <button id="restartBtn">PLAY AGAIN</button>
            </div>
            <div id="winScreen" class="hidden">
                <h1>YOU WIN!</h1>
                <p>Score: <span id="winScore">0</span></p>
                <button id="nextBtn">NEXT LEVEL</button>
            </div>
            <div id="hud">
                <div class="hud-line">Score: <span id="score">0</span></div>
                <div class="hud-line">Health: <span id="health">3</span></div>
                <div class="hud-line">Level: <span id="level">1</span></div>
            </div>
            <div id="instructions">
                Click/Tap to move | Reach green spaceship | Avoid red enemies | Collect purple power-ups
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let et, spaceship;
        let enemies = [];
        let powerups = [];
        let gameRunning = false;
        let gameState = {
            score: 0,
            health: 3,
            level: 1
        };

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x001a4d);
            scene.fog = new THREE.Fog(0x001a4d, 400, 1000);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 40, 80);

            // Renderer
            const canvas = document.getElementById('gameCanvas');
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(100, 100, 100);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            // Ground
            const groundGeometry = new THREE.PlaneGeometry(300, 300);
            const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x2d5a2d });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Create E.T.
            createET();

            // Create Spaceship
            createSpaceship();

            // Create initial enemies
            createEnemies();

            // Create powerups
            createPowerups();

            // Event listeners
            document.getElementById('startBtn').addEventListener('click', startGame);
            document.getElementById('restartBtn').addEventListener('click', startGame);
            document.getElementById('nextBtn').addEventListener('click', nextLevel);
            document.addEventListener('click', moveET);
            document.addEventListener('touchstart', moveET);
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function createET() {
            const group = new THREE.Group();

            // Body
            const bodyGeometry = new THREE.SphereGeometry(2, 32, 32);
            const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0xaa6600 });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            // Head
            const headGeometry = new THREE.SphereGeometry(1.5, 32, 32);
            const head = new THREE.Mesh(headGeometry, bodyMaterial);
            head.position.y = 3;
            head.castShadow = true;
            group.add(head);

            // Eyes
            const eyeGeometry = new THREE.SphereGeometry(0.6, 16, 16);
            const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000 });
            const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            leftEye.position.set(-0.7, 3.8, 1.5);
            const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            rightEye.position.set(0.7, 3.8, 1.5);
            group.add(leftEye);
            group.add(rightEye);

            group.position.set(0, 2, 0);
            et = group;
            scene.add(et);
        }

        function createSpaceship() {
            const group = new THREE.Group();

            // Cone body
            const bodyGeometry = new THREE.ConeGeometry(6, 20, 32);
            const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0x00ff00, emissive: 0x00aa00 });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            // Add glow
            const pointLight = new THREE.PointLight(0x00ff00, 2, 100);
            pointLight.position.y = 5;
            group.add(pointLight);

            group.position.set(-80, 5, -80);
            spaceship = group;
            scene.add(spaceship);
        }

        function createEnemies() {
            enemies.forEach(e => scene.remove(e));
            enemies = [];

            const count = 3 + gameState.level;
            for (let i = 0; i < count; i++) {
                const x = (Math.random() - 0.5) * 200;
                const z = (Math.random() - 0.5) * 200;

                const group = new THREE.Group();
                const bodyGeometry = new THREE.CubeGeometry(3, 4, 3);
                const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 });
                const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
                body.castShadow = true;
                group.add(body);

                const headGeometry = new THREE.SphereGeometry(1.2, 16, 16);
                const head = new THREE.Mesh(headGeometry, bodyMaterial);
                head.position.y = 3;
                group.add(head);

                group.position.set(x, 2, z);
                group.userData = { vx: (Math.random() - 0.5) * 2, vz: (Math.random() - 0.5) * 2 };
                scene.add(group);
                enemies.push(group);
            }
        }

        function createPowerups() {
            powerups.forEach(p => scene.remove(p));
            powerups = [];

            const count = 8 + gameState.level * 2;
            for (let i = 0; i < count; i++) {
                const x = (Math.random() - 0.5) * 200;
                const z = (Math.random() - 0.5) * 200;

                const geometry = new THREE.OctahedronGeometry(1, 0);
                const material = new THREE.MeshStandardMaterial({ color: 0xff00ff, emissive: 0xff00ff });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(x, 2, z);
                mesh.castShadow = true;
                scene.add(mesh);
                powerups.push(mesh);
            }
        }

        function startGame() {
            gameRunning = true;
            gameState = { score: 0, health: 3, level: gameState.level };
            
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('winScreen').classList.add('hidden');
            document.getElementById('hud').style.display = 'block';
            document.getElementById('instructions').style.display = 'block';

            et.position.set(0, 2, 0);
            createEnemies();
            createPowerups();
            updateHUD();
        }

        function moveET(event) {
            if (!gameRunning) return;
            
            let x, y;
            if (event.touches) {
                x = event.touches[0].clientX;
                y = event.touches[0].clientY;
            } else {
                x = event.clientX;
                y = event.clientY;
            }

            const targetX = (x / window.innerWidth - 0.5) * 300;
            const targetZ = (y / window.innerHeight - 0.5) * 300;

            et.userData.targetX = targetX;
            et.userData.targetZ = targetZ;
        }

        function updateGame() {
            if (!gameRunning) return;

            // Move E.T.
            if (et.userData.targetX !== undefined) {
                const dx = et.userData.targetX - et.position.x;
                const dz = et.userData.targetZ - et.position.z;
                const dist = Math.sqrt(dx * dx + dz * dz);
                
                if (dist > 2) {
                    et.position.x += (dx / dist) * 1.5;
                    et.position.z += (dz / dist) * 1.5;
                    et.rotation.y = Math.atan2(dx, dz);
                }
            }

            // Move enemies
            enemies.forEach(enemy => {
                enemy.position.x += enemy.userData.vx;
                enemy.position.z += enemy.userData.vz;

                if (Math.abs(enemy.position.x) > 150) enemy.userData.vx *= -1;
                if (Math.abs(enemy.position.z) > 150) enemy.userData.vz *= -1;

                // Chase E.T.
                const dx = et.position.x - enemy.position.x;
                const dz = et.position.z - enemy.position.z;
                const dist = Math.sqrt(dx * dx + dz * dz);
                if (dist < 80) {
                    enemy.userData.vx += (dx / dist) * 0.1;
                    enemy.userData.vz += (dz / dist) * 0.1;
                }

                // Rotate powerups
                powerups.forEach(p => {
                    p.rotation.x += 0.05;
                    p.rotation.y += 0.1;
                });
            });

            // Check collisions
            checkCollisions();

            // Update camera
            camera.position.x = et.position.x * 0.5;
            camera.position.z = et.position.z + 80;
            camera.lookAt(et.position.x, 20, et.position.z);
        }

        function checkCollisions() {
            // Powerups
            for (let i = powerups.length - 1; i >= 0; i--) {
                const dist = et.position.distanceTo(powerups[i].position);
                if (dist < 5) {
                    gameState.score += 50;
                    scene.remove(powerups[i]);
                    powerups.splice(i, 1);
                }
            }

            // Enemies
            enemies.forEach(enemy => {
                const dist = et.position.distanceTo(enemy.position);
                if (dist < 6) {
                    gameState.health--;
                    et.position.set(0, 2, 0);
                    if (gameState.health <= 0) {
                        gameOver();
                    }
                }
            });

            // Spaceship
            const distToShip = et.position.distanceTo(spaceship.position);
            if (distToShip < 15) {
                winLevel();
            }
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('hud').style.display = 'none';
            document.getElementById('instructions').style.display = 'none';
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('finalScore').textContent = gameState.score;
        }

        function winLevel() {
            gameRunning = false;
            document.getElementById('hud').style.display = 'none';
            document.getElementById('instructions').style.display = 'none';
            document.getElementById('winScreen').classList.remove('hidden');
            document.getElementById('winScore').textContent = gameState.score;
        }

        function nextLevel() {
            gameState.level++;
            startGame();
        }

        function updateHUD() {
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('health').textContent = gameState.health;
            document.getElementById('level').textContent = gameState.level;
        }

        function animate() {
            requestAnimationFrame(animate);
            updateGame();
            if (gameRunning) updateHUD();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
